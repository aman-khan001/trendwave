{% extends "base.html" %} {% block content %}

<div class="container d-flex my-5 justify-content-center align-items-center ">
  <form method="post" class="w-50 rounded-3 bg-dark p-5">
    <h2 class="text-center text-light mb-5">Signin Now</h2>
    {% csrf_token %}
    <div class="mb-3">
      <input type="text" class="form-control" name="Username" placeholder="Enter Username" required />
    </div>
    <div class="mb-3">
      <input type="password" placeholder="Enter Password" class="form-control" name="Password" />
    </div>

    {% if not request.user.is_authenticated %}
        <small class="text-danger d-block my-4">{{error}}</small>
    {% endif %}

    <button type="submit" class="btn btn-danger px-5">Signin</button>

    <small class="text-light">Don't have any account <a href="{% url "signup" %}">Create a new Account.</a></small>
  </form>
</div>

{% endblock content %}
